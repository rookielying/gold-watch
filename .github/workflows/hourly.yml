name: hourly-gold-watch

on:
  schedule:
    # 北京时间 9:00-23:00 每个整点运行 (UTC 1:00-15:00，北京时间 = UTC +8)
    - cron: "0 1-15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hourly-gold-watch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: .
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python -m src.main

      - name: Commit & push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ state/ docs/data/ || true
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "chore(gold): hourly snapshot $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
